name = "cirrus-api"
main = "index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "CIRRUS_SUBSCRIPTIONS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

