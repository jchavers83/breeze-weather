name = "cirrus-api"
main = "index.js"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "CIRRUS_SUBSCRIPTIONS"
id = "f1e082d006d9418e96fb4e6bd4f3c817"

[triggers]
crons = ["*/5 * * * *", "0 * * * *"]

# Set these in the Cloudflare dashboard → Worker → Settings → Environment Variables
# Never put real keys in this file.
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# STRIPE_MONTHLY_PRICE_ID
# STRIPE_ANNUAL_PRICE_ID
# BETA_CODES
# ONESIGNAL_APP_ID          (30178abc-998e-48d7-9594-21f2914087f0)
# ONESIGNAL_REST_API_KEY    (from OneSignal → Settings → Keys & IDs)
# WEATHER_API_KEY            (same key used in the frontend)
# RESEND_API_KEY             (from resend.com → API Keys → Create API Key)
# RESEND_AUDIENCE_ID         (from resend.com → Audiences → create one, copy ID)
